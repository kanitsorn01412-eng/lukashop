<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lukashop • สินค้า</title>
  <style>
    :root{--bg:#0f172a;--card:#111827;--txt:#e5e7eb;--muted:#94a3b8;--pri:#38bdf8}
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif}
    body{margin:0;background:var(--bg);color:var(--txt)}
    header{position:sticky;top:0;background:#0b1220;border-bottom:1px solid #1f2937}
    .nav{max-width:980px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
    .nav b{font-size:18px}
    .spacer{flex:1}
    .badge{background:#132033;border:1px solid #1f2a40;color:#94a3b8;padding:6px 10px;border-radius:10px;font-size:13px;text-decoration:none}
    .wrap{max-width:780px;margin:18px auto;padding:0 16px}
    .card{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:16px}
    .muted{color:var(--muted)}
    .row{display:grid;gap:12px}
    .btn{padding:10px 12px;border-radius:10px;background:var(--pri);color:#001825;border:0;font-weight:800}
    input[type=number]{width:90px;padding:8px;border-radius:10px;border:1px solid #263244;background:#0b1220;color:var(--txt)}
    a{color:#8ab4ff}
  </style>
</head>
<body>
<header>
  <div class="nav">
    <div>👾</div><b>Lukashop</b>
    <div class="spacer"></div>
    <a href="cart.html" class="badge" id="cart-badge">ตะกร้า (เดโม่) • 0 ชิ้น</a>
  </div>
</header>

<div class="wrap">
  <a href="shop.html">← กลับร้านค้า</a>
  <div class="card">
    <div class="row">
      <h2 id="pname" style="margin:0"></h2>
      <div class="muted" id="pdesc"></div>
      <div id="pprice" style="font-weight:800"></div>
      <div>
        <label>จำนวน</label>
        <input type="number" id="qty" min="1" value="1" />
      </div>
      <button class="btn" id="add">เพิ่มลงตะกร้า (เดโม่)</button>
      <p class="muted">* เดโม่: ยังไม่เชื่อมชำระเงินจริง</p>
    </div>
  </div>
</div>

<script>
  // สินค้าทดสอบต้องตรงกับ shop.html
  const PRODUCTS = {
    bili30 : { name:'Bilibili Premium / 30 วัน', price:29, desc:'ดูการ์ตูน/อนิเมะ • Full HD' },
    viu30  : { name:'VIU Premium / 30 วัน',      price:29, desc:'ซีรีส์/บันเทิง • Full HD' },
    iqiyi30: { name:'iQIYI VIP / 30 วัน',         price:29, desc:'หนัง/ซีรีส์ • ไม่มีโฆษณา' },
  };

  const params = new URLSearchParams(location.search);
  const sku = params.get('sku') || 'bili30';
  const item = PRODUCTS[sku];

  // องค์ประกอบ
  const badge = document.getElementById('cart-badge');
  const pname = document.getElementById('pname');
  const pdesc = document.getElementById('pdesc');
  const pprice = document.getElementById('pprice');
  const qtyEl = document.getElementById('qty');

  // helper เก็บ/อ่านตะกร้า
  const saveItems = (items) => localStorage.setItem('demoCartItems', JSON.stringify(items));
  const loadItems = () => JSON.parse(localStorage.getItem('demoCartItems') || '[]');
  const updateCountFromItems = () => {
    const items = loadItems();
    const count = items.reduce((s,it)=>s+it.qty,0);
    localStorage.setItem('demoCartCount', count);
    return count;
  };
  const updateBadge = () => {
    badge.textContent = `ตะกร้า (เดโม่) • ${updateCountFromItems()} ชิ้น`;
  };

  // แสดงผลสินค้า
  pname.textContent = item.name;
  pdesc.textContent = item.desc;
  pprice.textContent = `฿${item.price.toFixed(2)}`;

  // เพิ่มลงตะกร้า
  document.getElementById('add').onclick = () => {
    const addQty = Math.max(1, Number(qtyEl.value || 1));
    const items = loadItems();
    const idx = items.findIndex(x => x.sku === sku);
    if (idx >= 0) items[idx].qty += addQty;
    else items.push({ sku, name:item.name, price:item.price, qty:addQty });
    saveItems(items);
    updateBadge();
    alert(`เพิ่ม ${item.name} x${addQty} ลงตะกร้า (เดโม่) แล้ว!`);
  };

  updateBadge();
</script>
</body>
</html>
