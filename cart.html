<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lukashop • ตะกร้า</title>
  <style>
    :root{--bg:#0f172a;--card:#111827;--txt:#e5e7eb;--muted:#94a3b8;--pri:#38bdf8;--danger:#ef4444}
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif}
    body{margin:0;background:var(--bg);color:var(--txt)}
    header{position:sticky;top:0;background:#0b1220;border-bottom:1px solid #1f2937}
    .nav{max-width:980px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
    .nav b{font-size:18px}
    .spacer{flex:1}
    .badge{background:#132033;border:1px solid #1f2a40;color:#94a3b8;padding:6px 10px;border-radius:10px;font-size:13px;text-decoration:none}
    .wrap{max-width:980px;margin:18px auto;padding:0 16px}
    .card{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:16px}
    .muted{color:var(--muted)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid #1f2937;text-align:left}
    .qtyctrl{display:flex;align-items:center;gap:6px}
    .btn{padding:8px 10px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
    .btn-sm{padding:6px 10px;font-size:13px}
    .btn-plain{background:#0b1220;color:var(--txt);border:1px solid #263244}
    .btn-danger{background:var(--danger);color:white}
    .btn-primary{background:var(--pri);color:#001825}
    .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
  </style>
</head>
<body>
<header>
  <div class="nav">
    <div>👾</div><b>Lukashop</b>
    <div class="spacer"></div>
    <a href="cart.html" class="badge" id="cart-badge">ตะกร้า (เดโม่) • 0 ชิ้น</a>
  </div>
</header>

<div class="wrap">
  <a href="shop.html">← กลับร้านค้า</a>
  <div class="card" style="margin-top:12px">
    <h2 style="margin:0 0 12px">ตะกร้าสินค้า</h2>

    <div id="empty" class="muted" style="display:none">ยังไม่มีสินค้าในตะกร้า</div>
    <div id="tablewrap" style="overflow:auto">
      <table>
        <thead>
          <tr><th>สินค้า</th><th>ราคา</th><th>จำนวน</th><th>รวม</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
        <tfoot>
          <tr><td colspan="3" style="font-weight:800">ยอดรวมทั้งหมด</td><td id="grand" style="font-weight:800">฿0.00</td><td></td></tr>
        </tfoot>
      </table>
    </div>

    <div class="actions">
      <button class="btn btn-plain" id="clear">ล้างตะกร้า</button>
      <button class="btn btn-primary" id="checkout">ไปหน้า Checkout (เดโม่)</button>
    </div>
    <p class="muted">* ทั้งหมดนี้เป็นเดโม่ ยังไม่เชื่อมต่อการชำระเงินจริง</p>
  </div>
</div>

<script>
  const badge = document.getElementById('cart-badge');
  const loadItems = () => JSON.parse(localStorage.getItem('demoCartItems') || '[]');
  const saveItems = (items) => localStorage.setItem('demoCartItems', JSON.stringify(items));
  const setCount = (n) => localStorage.setItem('demoCartCount', n);
  const updateBadge = () => {
    const items = loadItems();
    const count = items.reduce((s,it)=>s+it.qty,0);
    setCount(count);
    badge.textContent = `ตะกร้า (เดโม่) • ${count} ชิ้น`;
  };

  const rowsEl = document.getElementById('rows');
  const grandEl = document.getElementById('grand');
  const emptyEl = document.getElementById('empty');
  const tableWrap = document.getElementById('tablewrap');

  function render(){
    const items = loadItems();
    rowsEl.innerHTML = '';
    if(items.length===0){
      emptyEl.style.display='block';
      tableWrap.style.display='none';
      grandEl.textContent='฿0.00';
      updateBadge();
      return;
    }
    emptyEl.style.display='none';
    tableWrap.style.display='block';

    let grand=0;
    items.forEach((it,i)=>{
      const tr=document.createElement('tr');

      const name=document.createElement('td'); name.textContent=it.name;
      const price=document.createElement('td'); price.textContent=`฿${it.price.toFixed(2)}`;

      const qty=document.createElement('td');
      const wrap=document.createElement('div'); wrap.className='qtyctrl';
      const minus=document.createElement('button'); minus.className='btn btn-sm btn-plain'; minus.textContent='−';
      const num=document.createElement('span'); num.textContent=it.qty;
      const plus=document.createElement('button'); plus.className='btn btn-sm btn-plain'; plus.textContent='+';
      wrap.append(minus,num,plus); qty.appendChild(wrap);

      const sum=document.createElement('td');
      const subtotal=it.price*it.qty; sum.textContent=`฿${subtotal.toFixed(2)}`; grand+=subtotal;

      const del=document.createElement('td');
      const rm=document.createElement('button'); rm.className='btn btn-sm btn-danger'; rm.textContent='ลบ';
      del.appendChild(rm);

      minus.onclick=()=>{ if(it.qty>1){ it.qty--; saveAndRender(); } };
      plus.onclick =()=>{ it.qty++; saveAndRender(); };
      rm.onclick   =()=>{ items.splice(i,1); saveAndRender(); };

      tr.append(name,price,qty,sum,del);
      rowsEl.appendChild(tr);
    });

    grandEl.textContent=`฿${grand.toFixed(2)}`;
    saveItems(items);
    updateBadge();
  }

  function saveAndRender(){ saveItems(loadItems()); render(); }

  document.getElementById('clear').onclick=()=>{ saveItems([]); render(); };
  document.getElementById('checkout').onclick=()=>{ alert('เดโม่: หน้านี้จะไป Checkout (ยังไม่เชื่อมชำระเงินจริง)'); };

  render();
</script>
</body>
</html>
