<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lukashop • เข้าสู่ระบบ / สมัครสมาชิก</title>
  <style>
    :root{--bg:#0f172a;--card:#111827;--txt:#e5e7eb;--muted:#94a3b8;--pri:#38bdf8;}
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif}
    body{margin:0;background:var(--bg);color:var(--txt)}
    .wrap{max-width:520px;margin:32px auto;padding:20px}
    .brand{display:flex;gap:10px;align-items:center;margin-bottom:16px}
    .brand b{font-size:22px}
    .card{background:var(--card);border:1px solid #1f2937;border-radius:14px;padding:18px}
    .tabs{display:flex;background:#0b1220;border-radius:10px;padding:4px;margin-bottom:14px}
    .tab{flex:1;text-align:center;padding:10px;border-radius:8px;color:var(--muted);cursor:pointer}
    .tab.active{background:var(--pri);color:#001825;font-weight:700}
    .field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
    label{color:var(--muted);font-size:13px}
    input{padding:12px;border:1px solid #263244;background:#0b1220;color:var(--txt);border-radius:10px}
    button{width:100%;padding:12px 14px;border:0;border-radius:10px;background:var(--pri);color:#001825;font-weight:700}
    .hint{margin-top:10px;color:var(--muted);font-size:13px;text-align:center}
    a{color:var(--pri);text-decoration:none}
    .back{display:inline-block;margin-top:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span style="font-size:22px">👾</span><b>Lukashop</b></div>

    <div class="card">
      <div class="tabs">
        <div class="tab active" id="t-login">เข้าสู่ระบบ</div>
        <div class="tab" id="t-sign">สมัครสมาชิก</div>
      </div>

      <!-- เข้าสู่ระบบ -->
      <form id="form-login">
        <div class="field">
          <label>อีเมล</label>
          <input type="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label>รหัสผ่าน</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit">เข้าสู่ระบบ</button>
        <div class="hint">* ตัวอย่าง UI เท่านั้น ยังไม่เชื่อมต่อหลังบ้าน</div>
      </form>

      <!-- สมัครสมาชิก -->
      <form id="form-sign" style="display:none">
        <div class="field">
          <label>ชื่อผู้ใช้</label>
          <input type="text" placeholder="ตั้งชื่อผู้ใช้" required>
        </div>
        <div class="field">
          <label>อีเมล</label>
          <input type="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label>รหัสผ่าน</label>
          <input type="password" placeholder="ตั้งรหัสผ่าน" required>
        </div>
        <button type="submit">สมัครสมาชิก</button>
        <div class="hint">* ตัวอย่าง UI เท่านั้น</div>
      </form>
    </div>

    <a class="back" href="index.html">← กลับหน้าหลัก</a>
  </div>

  <script>
    const tLogin = document.getElementById('t-login');
    const tSign  = document.getElementById('t-sign');
    const fLogin = document.getElementById('form-login');
    const fSign  = document.getElementById('form-sign');

    tLogin.onclick = () => {
      tLogin.classList.add('active'); tSign.classList.remove('active');
      fLogin.style.display = '';      fSign.style.display = 'none';
    };
    tSign.onclick = () => {
      tSign.classList.add('active');  tLogin.classList.remove('active');
      fSign.style.display = '';       fLogin.style.display = 'none';
    };

    // กัน submit จริง – โชว์ alert แทน (เดโม่)
    [fLogin, fSign].forEach(f => f.addEventListener('submit', e => {
      e.preventDefault();
      alert('เดโม่: ยังไม่ได้เชื่อมระบบหลังบ้าน');
      location.href = 'shop.html'; // ลองพาไปหน้าร้าน
    }));
  </script>
</body>
</html>
