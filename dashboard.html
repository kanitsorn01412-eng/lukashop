<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lukashop • Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#e5e7eb}
    .wrap{max-width:900px;margin:40px auto;padding:0 16px}
    .top{display:flex;justify-content:space-between;align-items:center}
    .btn{background:#38bdf8;color:#031522;border:none;border-radius:10px;padding:10px 14px;font-weight:700}
    .card{margin-top:16px;background:#111827;border:1px solid #1f2937;border-radius:14px;padding:18px}
    a{color:#38bdf8;text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h2>👾 Lukashop — Dashboard</h2>
      <div>
        <a href="shop.html">ไปหน้าสินค้า</a>
        <button id="logout" class="btn" style="margin-left:10px">ออกจากระบบ</button>
      </div>
    </div>

    <div id="info" class="card">กำลังตรวจสอบบัญชีผู้ใช้...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://kadrnzxpgyrnfxvmjhvv.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZHJuenhwZ3lybmZ4dm1qaHZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3NTY4ODcsImV4cCI6MjA3NjMzMjg4N30.D0AqZvFbul6FbNIC1lJbgubil0Jq8hKPwIR6gnbWdxI";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (async () => {
      const { data: { session } } = await client.auth.getSession();
      const info = document.getElementById('info');
      if (!session) {
        info.innerHTML = "❌ ยังไม่เข้าสู่ระบบ — <a href='auth.html'>ไปเข้าสู่ระบบ</a>";
        return;
      }
      const user = session.user;
      const uname = user.user_metadata?.username || "(ไม่มีชื่อผู้ใช้)";
      info.innerHTML = `✅ เข้าสู่ระบบแล้ว<br>อีเมล: <b>${user.email}</b><br>ชื่อผู้ใช้: <b>${uname}</b>`;
    })();

    document.getElementById('logout').onclick = async () => {
      await client.auth.signOut();
      location.href = "auth.html";
    };
  </script>
</body>
</html>
